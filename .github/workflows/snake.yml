# Outputs both SVGs to the `output` branch.
# README must reference them via raw.githubusercontent.com/And3m/And3m/output/...
# NOT github.com/And3m/And3m/blob/output/... -- blob URLs serve an HTML page and
# render as a broken image.
name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    # Avoid re-triggering on commits pushed by the other workflows
    paths-ignore:
      - 'profile-3d-contrib/**'
      - 'README.md'
      - 'WARP.md'

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Snake Game from GitHub contribution grid
        uses: Platane/snk@v3
        with:
          github_user_name: And3m
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push Snake Image to GitHub
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
